name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 1.21.1
        run: ./gradlew :1.21.1:build --no-daemon

      - name: Verify exactly one distributable jar
        run: |
          set -euo pipefail
          mapfile -t jars < <(find versions/1.21.1/build/libs -type f -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runtime JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          echo "Built: ${jars[0]}"
